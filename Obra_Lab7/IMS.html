<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="imsStyle.css" />
</head>

<body>

<div class="content">
    <h1>Inventory Management System</h1>

    <form class="form-row" id="productForm">
        <input type="text"   id="productName"  placeholder="Product Name" />
        <input type="number" id="productPrice" placeholder="Price" min="1"/>
        <input type="number" id="productStock" placeholder="Stock Quantity"/>
        <button type="button" id="addBtn" class="btn-add"> <b>Add Product</b></button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Item Name</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script src="imsScript.js"></script>

</body>
</html>
